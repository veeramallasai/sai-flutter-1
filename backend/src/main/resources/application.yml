server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: farm-to-home-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/farm_to_home}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/farm_to_home}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors-origins: "${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://farm-to-home.up.railway.app,https://*.up.railway.app}"
  mail-from: ${MAIL_FROM:noreply@farmtohome.com}

logging:
  level:
    root: INFO
    org.springframework.security: WARN


